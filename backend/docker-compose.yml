services:
  db:
    image: postgres:16
    container_name: nhatvibecoders-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nhatvibecoders
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nhatvibecoders_pgdata:/var/lib/postgresql/data

volumes:
  nhatvibecoders_pgdata:
